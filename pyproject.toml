[project]
name = "codicil"
version = "0.1.0"
description = "Cited, abstaining question answering over the current RBI Directions"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "pypdf>=5.0",
  "pdfminer.six>=20240706",
  "snowballstemmer>=2.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "huggingface_hub>=0.26",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.12"]

[dependency-groups]
dev = ["qdrant-client>=1.12", "pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.7", "mypy>=1.13", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
extend-exclude = ["eval/work"]
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "ANN"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "ANN401", "PLC0415", "B008", "UP046", "RUF001", "RUF002", "RUF003", "PLR0912", "PLR0915"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR", "E501", "E701", "E702"]
"eval/**" = ["ANN", "PLR", "E501", "E701", "E702", "SIM", "RUF005"]
"scripts/**" = ["E501", "PLR", "PLW1510"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]


[[tool.mypy.overrides]]
module = ["snowballstemmer", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
